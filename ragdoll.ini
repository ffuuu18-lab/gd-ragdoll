# gd-ragdoll - make Grim Dawn monsters ragdoll instead of playing canned death animations.
#
# Lives next to ragdoll.asi in <Grim Dawn>\x64\. Read once at launch, so changes need a restart.
# deploy.ps1 never overwrites this file once it exists, so your edits survive an update.
#
# The stock game only allows FIVE ragdolls at once. In a pack clear the sixth corpse onwards plays
# a canned death animation, which is the whole reason deaths look inconsistent. That limit is what
# this mod lifts.
#
# It does not modify Game.dll. It hooks one function and, for the duration of the original call,
# shows the engine a ragdoll count that passes its own test, then restores the true count. The
# game's bytes stay exactly as shipped, which matters because other plugins locate their own
# targets by scanning those same bytes.

# Master switch. 0 = change nothing. The counters still run, so a session with enabled=0 is a
# useful control run: the log tells you what the stock game does.
enabled=1

# ---------------------------------------------------------------------------------------------
# The ragdoll ceiling
# ---------------------------------------------------------------------------------------------
liftCap=1

# 0 = no ceiling at all. N = allow a ragdoll while fewer than N are already live.
#
# A corpse here is a two-body physics proxy, not an articulated ragdoll, so it is cheap: 28
# concurrent was measured with no ill effect. If a huge fight ever stutters, put 40 here rather
# than turning liftCap off - that keeps the behaviour and just bounds the worst case.
maxActiveRagdolls=0

# ---------------------------------------------------------------------------------------------
# Troubleshooting - leave these alone unless something has gone wrong
# ---------------------------------------------------------------------------------------------
# An earlier version lifted the cap by rewriting an instruction in Game.dll. It worked, but
# editing a shared game DLL in place is a bad neighbour: other plugins locate their own targets by
# scanning the same loaded image, and an edit in the middle of a function makes those scans miss.
# Only enable this if the runtime method above ever stops working, and expect anything else that
# scans the game's code to misbehave while it is on.
patchBytes=0

# Ignore a record's ragdollPhysics=0. That flag is a deliberate per-record opt-out by Crate on 196
# records, some of them bosses whose death is staged. It has no runtime equivalent, so it needs
# patchBytes=1 and is off by default.
#
# Two conditions are never bypassed, whatever you set here:
#   - the mesh must actually have a ragdoll rig. 23% of Grim Dawn's creature meshes ship without
#     one and have nothing to simulate; those keep animating no matter what.
#   - the victim must be on screen. Nobody watched those deaths, and skipping them leaves more of
#     the budget for the ones you can see.
ignoreRagdollFlag=0

# ---------------------------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------------------------
# 0 off, 1 startup lines plus a periodic tally, 2 adds one line per death naming the condition
# that refused it. 1 is right for normal play; use 2 if you want to see exactly what is happening.
logLevel=1
summaryEvery=25

# Where the log goes. Commented out = ragdoll.log next to the .asi. Set it if the game folder is
# not writable, or if you just want it somewhere easier to find.
# logPath=C:\Users\you\Desktop\ragdoll.log
